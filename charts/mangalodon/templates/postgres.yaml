apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: {{ .Chart.Name }}
  method: kubernetes
  mount: {{ .Values.vault.kubernetesAuthMountPath }}
  kubernetes:
    role: {{ .Chart.Name }}-{{ .Values.postgres.name }}-{{ .Values.env }}
    serviceAccount: {{ .Values.postgres.name }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Values.postgres.name }}-user
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Values.postgres.name }}
  mount: {{ .Values.vault.kvEngine.mountPath }}
  type: kv-{{ .Values.vault.kvEngine.version }}
  path: {{ replace "<env>" .Values.env .Values.postgres.vaultSecretPath }}
  refreshAfter: 10m
  destination:
    name: {{ .Values.postgres.name }}-user
    create: true
    overwrite: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.name }}-initdb
  namespace: {{ .Release.Namespace }}
data:
  schema.sql: |
    SET ROLE {{ .Values.postgres.username }};

    CREATE TABLE IF NOT EXISTS scraper (
      id SERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL UNIQUE,
      note TEXT,
      url_format VARCHAR(512) NOT NULL,
      created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );

    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'manga_status') THEN
        CREATE TYPE manga_status AS ENUM ('ongoing', 'completed');
      END IF;
    END
    $$;

    CREATE TABLE IF NOT EXISTS manga (
      id SERIAL PRIMARY KEY,
      title VARCHAR(512) NOT NULL UNIQUE,
      manga_id VARCHAR(512) NOT NULL UNIQUE,
      first_chapter NUMERIC(5,1) NOT NULL,
      last_chapter NUMERIC(5,1) NOT NULL,
      current_chapter NUMERIC(5,1) NOT NULL,
      status manga_status DEFAULT 'ongoing',
      chapter_updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
      created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS source (
      id SERIAL PRIMARY KEY,
      manga_id INT NOT NULL REFERENCES manga(id) ON DELETE CASCADE,
      scraper_id INT NOT NULL REFERENCES scraper(id) ON DELETE CASCADE,
      url VARCHAR(512) NOT NULL,
      priority INT NOT NULL,
      created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
      UNIQUE (manga_id, scraper_id, priority)
    );

    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'job_status') THEN
        CREATE TYPE job_status AS ENUM ('unknown', 'working', 'completed', 'error');
      END IF;
    END
    $$;

    CREATE TABLE IF NOT EXISTS job (
      id SERIAL PRIMARY KEY,
      manga_id INT NOT NULL REFERENCES manga(id) ON DELETE CASCADE,
      scraper_id INT REFERENCES scraper(id) ON DELETE SET NULL,
      status job_status DEFAULT 'unknown',
      chapter NUMERIC(5,1) NOT NULL,
      created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
      UNIQUE (manga_id, chapter)
    );

    CREATE OR REPLACE FUNCTION update_updated_at_column()
      RETURNS TRIGGER AS $$
      BEGIN
          NEW.updated_at = CURRENT_TIMESTAMP;
          RETURN NEW;
    END;
    $$ language 'plpgsql';

    CREATE OR REPLACE TRIGGER update_scraper_updated_at
    BEFORE UPDATE ON scraper
    FOR EACH ROW
    EXECUTE FUNCTION update_updated_at_column();

    CREATE OR REPLACE TRIGGER update_manga_updated_at
    BEFORE UPDATE ON manga
    FOR EACH ROW
    EXECUTE FUNCTION update_updated_at_column();

    CREATE OR REPLACE TRIGGER update_source_updated_at
    BEFORE UPDATE ON source
    FOR EACH ROW
    EXECUTE FUNCTION update_updated_at_column();

    CREATE OR REPLACE TRIGGER update_job_updated_at
    BEFORE UPDATE ON job
    FOR EACH ROW
    EXECUTE FUNCTION update_updated_at_column();
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.postgres.name }}
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: {{ .Values.postgres.version }}
  instances: {{ .Values.postgres.replicas }}
  {{- if .Values.postgres.extensions.pgvector }}
  postgresql:
    extensions:
      - name: pgvector
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Chart.Name }}
      owner: {{ .Values.postgres.username }}
      secret:
        name: {{ .Values.postgres.name }}-user
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: {{ .Values.postgres.name }}-initdb
            key: schema.sql
  storage:
    storageClass: {{ .Values.postgres.storage.className }}
    size: {{ .Values.postgres.storage.size }}
  walStorage:
    storageClass: {{ .Values.postgres.walStorage.className }}
    size: {{ .Values.postgres.walStorage.size }}
