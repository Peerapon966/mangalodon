apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.postgres.name }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.postgres.name }}
spec:
  vaultConnectionRef: {{ .Chart.Name }}
  method: kubernetes
  mount: {{ .Values.vault.kubernetesAuthMountPath }}
  kubernetes:
    role: {{ .Chart.Name }}-{{ .Values.postgres.name }}-{{ .Values.env }}
    serviceAccount: {{ .Values.postgres.name }}
---
{{- range $key, $value := .Values.postgres.users }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $.Values.postgres.name }}-{{ $key }}-user
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Chart.Name }}
    service: {{ $.Values.postgres.name }}
spec:
  vaultAuthRef: {{ $.Values.postgres.name }}
  mount: {{ $.Values.vault.kvEngine.mountPath }}
  type: kv-{{ $.Values.vault.kvEngine.version }}
  path: {{ replace "<env>" $.Values.env $value.vaultSecretPath }}
  refreshAfter: 10m
  destination:
    name: {{ $.Values.postgres.name }}-{{ $key }}-user
    labels:
      cnpg.io/reload: "true"
    create: true
    overwrite: true
---
{{- end }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Values.postgres.name }}-url
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.postgres.name }}
spec:
  vaultAuthRef: {{ .Values.postgres.name }}
  mount: {{ .Values.vault.kvEngine.mountPath }}
  type: kv-{{ .Values.vault.kvEngine.version }}
  path: {{ replace "<env>" .Values.env .Values.postgres.users.admin.vaultSecretPath }}
  refreshAfter: 10m
  destination:
    name: {{ .Values.postgres.name }}-url
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        rw:
          text: |
            {{ `{{- printf "postgresql://%s:%s@` }}{{ .Values.postgres.name }}-rw.{{ .Release.Namespace }}.svc:5432/{{ .Chart.Name }}?options=-c search_path={{ .Values.postgres.schema }}{{ `" (get .Secrets "username") (get .Secrets "password") -}}` }}
        ro:
          text: |
            {{ `{{- printf "postgresql://%s:%s@` }}{{ .Values.postgres.name }}-ro.{{ .Release.Namespace }}.svc:5432/{{ .Chart.Name }}?options=-c search_path={{ .Values.postgres.schema }}{{ `" (get .Secrets "username") (get .Secrets "password") -}}` }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.postgres.name }}
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: {{ .Values.postgres.version }}
  instances: {{ .Values.postgres.replicas }}
  {{- if .Values.postgres.extensions.pgvector }}
  postgresql:
    extensions:
      - name: pgvector
  {{- end }}
  superuserSecret:
    name: {{ .Values.postgres.name }}-postgres-user
  managed:
    roles:
    - name: {{ .Values.postgres.users.app.username }}
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: {{ .Values.postgres.name }}-app-user
      inRoles:
        - pg_monitor
        - pg_signal_backend
  bootstrap:
    initdb:
      database: {{ .Chart.Name }}
      owner: {{ .Values.postgres.users.admin.username }}
      secret:
        name: {{ .Values.postgres.name }}-url
  storage:
    storageClass: {{ .Values.postgres.storage.className }}
    size: {{ .Values.postgres.storage.size }}
  walStorage:
    storageClass: {{ .Values.postgres.walStorage.className }}
    size: {{ .Values.postgres.walStorage.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate-{{ now | unixEpoch }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.postgres.name }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      securityContext:
        {{- include "mangalodon.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: flyway-data
          image: {{ .Values.postgres.flyway.dataImage.repository | default .Values.images.repository }}:{{ .Values.postgres.flyway.dataImage.tag }}
          command: ["sh", "-c", "cp -r /opt/flyway /flyway && sleep 60"]
          securityContext:
            {{- include "mangalodon.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: flyway-data
              mountPath: /flyway
      containers:
        - name: flyway
          image: flyway/flyway:{{ .Values.postgres.flyway.version }}-alpine
          args: ["migrate"]
          securityContext:
            {{- include "mangalodon.containerSecurityContext" . | nindent 12 }}
          env:
            - name: FLYWAY_URL
              value: jdbc:postgresql://{{ .Values.postgres.name }}-rw.{{ .Release.Namespace }}.svc:5432/{{ .Chart.Name }}
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-admin-user
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-admin-user
                  key: password
            - name: FLYWAY_SCHEMAS
              value: {{ .Values.postgres.schema }}
            - name: FLYWAY_PLACEHOLDERS_SCHEMA
              value: {{ .Values.postgres.schema }}
            - name: FLYWAY_PLACEHOLDERS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-admin-user
                  key: username
            - name: FLYWAY_PLACEHOLDERS_APP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-app-user
                  key: username
          volumeMounts:
            - name: flyway-data
              mountPath: /flyway/sql
          {{- with .Values.postgres.flyway.resources }}
          resources:
            {{- toYaml . | nindent 16 }}
          {{- end }}
      volumes:
        - name: flyway-data
          emptyDir: {}
      restartPolicy: OnFailure
  backoffLimit: 3
