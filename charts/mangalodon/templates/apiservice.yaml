apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.apiservice.name }}
  namespace: {{ .Release.Namespace }}
# ---
# apiVersion: secrets.hashicorp.com/v1beta1
# kind: VaultAuth
# metadata:
#   name: {{ .Values.apiservice.name }}
#   namespace: {{ .Release.Namespace }}
# spec:
#   vaultConnectionRef: {{ .Chart.Name }}
#   method: kubernetes
#   mount: {{ .Values.vault.kubernetesAuthMountPath }}
#   kubernetes:
#     role: {{ .Chart.Name }}-{{ .Values.apiservice.name }}-{{ .Values.env }}
#     serviceAccount: {{ .Values.apiservice.name }}
