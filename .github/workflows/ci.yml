name: CI

on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting (Prettier & Gofmt)
        run: |
          npx prettier --check reader/**/*.ts
          npx eslint reader/**/*.ts
          gofmt -l .

      - name: Build Frontend
        run: npm run build

  tf-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ["dev", "prod"]
    environment:
      name: ${{ matrix.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -backend-config=init/backend-${{ vars.ENV }}.hcl

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate -var-file=tfvars/${{ vars.ENV }}.tfvars
