name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  validate-version:
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, 'rc') && 'staging' || 'prod' }}
    outputs:
      is-app-updated: ${{ steps.app-version.outputs.is_app_updated }}
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup semver Tool
        run: npm install -g semver

      - name: Set Service Details
        id: services
        run: |
          chmod +x .github/workflows/scripts/set-services.sh
          .github/workflows/scripts/set-services.sh

      - name: Validate Helm Chart Version
        run: |
          chmod +x .github/workflows/scripts/validate-helm-version.sh
          .github/workflows/scripts/validate-helm-version.sh

      - name: Validate App Versions
        id: app-version
        env:
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          chmod +x .github/workflows/scripts/validate-app-version.sh
          .github/workflows/scripts/validate-app-version.sh

  # todo: add app + helm tests
  test:
    needs: validate-version
    if: ${{ needs.validate-version.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, 'rc') && 'staging' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

  release-app:
    needs:
      - validate-version
      - test
    if: |
      needs.validate-version.outputs.is-app-updated &&
      needs.test.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, 'rc') && 'staging' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        env:
          SERVICES: ${{ needs.validate-version.outputs.services }}
        run: |
          TF_VAR_services="{}"
          while read -r item; do
            service=$(jq -r '.name' <<< "$item")
            tag=$(jq -r '.version' <<< "$item")

            if [[ $service == "app" ]]; then
              continue
            fi

            TF_VAR_services=$(echo "$TF_VAR_services" | jq --arg service "$service" --arg tag "$tag" '.[$service] = $tag')
          done < <(jq -c '.[]' <<< "$SERVICES")

          terraform init -backend-config=init/backend-${{ vars.ENV }}.hcl
          terraform workspace select -or-create ${{ vars.ENV }}
          terraform plan -out=tfplan -var-file=tfvars/${{ vars.ENV }}.tfvars

      - name: Build, tag, and push docker image to Amazon ECR (Terraform Apply)
        working-directory: infra
        run: terraform apply -auto-approve tfplan

  release-helm:
    needs:
      - test
      - release-app
    if: |
      always() && 
      needs.test.result == 'success' && 
      (needs.release-app.result == 'success' || needs.release-app.result == 'skipped')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, 'rc') && 'staging' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
