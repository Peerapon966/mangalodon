name: publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check_release.outputs.is_prerelease }}
    steps:
      - name: Check if tag is a pre-release
        id: check_release
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Tag is a stable release."
          elif [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Tag is a pre-release."
          else
            echo "Invalid tag '${{ github.ref_name }}'"
            echo "Tag name must follow semver guildline"
            exit 1
          fi

  validate-version:
    needs: check-tag
    if: ${{ needs.check-tag.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.check-tag.outputs.is_prerelease && 'staging' || 'prod' }}
    outputs:
      is-app-updated: ${{ steps.app-version.outputs.is_app_updated }}
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup semver Tool
        run: npm install -g semver

      - name: Set Service Details
        id: services
        run: |
          chmod +x .github/workflows/scripts/set-services.sh
          .github/workflows/scripts/set-services.sh

      - name: Validate Helm Chart Version
        run: |
          chmod +x .github/workflows/scripts/validate-helm-version.sh
          .github/workflows/scripts/validate-helm-version.sh

      - name: Validate App Versions
        id: app-version
        env:
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          chmod +x .github/workflows/scripts/validate-app-version.sh
          .github/workflows/scripts/validate-app-version.sh

  # todo: add app + helm tests
  test:
    needs:
      - check-tag
      - validate-version
    if: ${{ needs.validate-version.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.check-tag.outputs.is_prerelease && 'staging' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

  release-app:
    needs:
      - check-tag
      - validate-version
      - test
    if: |
      needs.validate-version.outputs.is-app-updated &&
      needs.test.result == 'success'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: ${{ needs.check-tag.outputs.is_prerelease && 'staging' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        env:
          SERVICES: ${{ needs.validate-version.outputs.services }}
        run: |
          set -xeuo pipefail

          TF_VAR_services="{}"
          while read -r item; do
            service=$(jq -r '.name' <<< "$item")
            tag=$(jq -r '.version' <<< "$item")

            if [[ $service == "app" ]]; then
              continue
            fi

            TF_VAR_services=$(echo "$TF_VAR_services" | jq --arg service "$service" --arg tag "$tag" '.[$service] = $tag')
          done < <(jq -c '.[]' <<< "$SERVICES")

          export TF_VAR_services="$TF_VAR_services"

          terraform init -backend-config=init/backend-${{ vars.ENV }}.hcl
          terraform workspace select -or-create ${{ vars.ENV }}
          terraform plan -out=tfplan -var-file=tfvars/${{ vars.ENV }}.tfvars

      - name: Build, tag, and push docker image to Amazon ECR (Terraform Apply)
        working-directory: infra
        run: terraform apply -auto-approve tfplan

  release-helm:
    needs:
      - check-tag
      - test
      - release-app
    if: |
      always() && 
      needs.test.result == 'success' && 
      (needs.release-app.result == 'success' || needs.release-app.result == 'skipped')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: ${{ needs.check-tag.outputs.is_prerelease && 'staging' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm-chart
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
