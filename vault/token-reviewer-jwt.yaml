apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-token-reviewer
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-reviewer
subjects:
- kind: ServiceAccount
  name: vault-token-reviewer
  namespace: vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator # built-in role with enough permissions for token reviewing
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-token-reviewer-jwt
  namespace: vault
  annotations:
    kubernetes.io/service-account.name: "vault-token-reviewer"
type: kubernetes.io/service-account-token
