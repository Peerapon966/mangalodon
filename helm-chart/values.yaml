# Mangalodon Helm Chart Values

serviceAccount:
  create: false
  annotations: {}

imagePullSecrets:
  - name: ecr-registry-secret

images:
  repository: ""

frontend:
  name: frontend
  image:
    repository: 741448960615.dkr.ecr.ap-southeast-1.amazonaws.com/mangalodon/frontend
    tag: 0.0.1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: false
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

apiservice:
  name: apiservice
  image:
    repository: 741448960615.dkr.ecr.ap-southeast-1.amazonaws.com/mangalodon/apiservice
    tag: 0.0.1
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: false
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

scrapeservice:
  name: scrapeservice
  image:
    repository: 741448960615.dkr.ecr.ap-southeast-1.amazonaws.com/mangalodon/scrapeservice
    tag: 0.0.1
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

ingress:
  classname: cilium
  host: ""
  annotations: {}
  tls: []

postgres:
  name: postgres
  username: app
  vaultSecretPath: kv/mangalodon/dev/postgres
  schema: public
  version: 18
  instanceCount: 3
  extensions:
    pgvector: true
  storageSize: 5Gi

vault:
  server: https://192.168.1.10:8200
  path: kv
  version: v2
  caBundle: 
  kubernetesAuthMountPath: kubernetes
